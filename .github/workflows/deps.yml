name: Deps

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deps:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate dependency snapshot from action.yml
        run: ruby .github/scripts/dependency-snapshot.rb > "$RUNNER_TEMP/action-dependencies.json"

      - name: Submit dependency snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method POST
          "repos/${GITHUB_REPOSITORY}/dependency-graph/snapshots"
          --input "$RUNNER_TEMP/action-dependencies.json"
